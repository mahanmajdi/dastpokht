<script>(function(){var L=['en','fa','ar','tr','es','fr','de','ru'],l=null;try{l=localStorage.getItem('dp.lang');}catch(e){}if(L.indexOf(l)<0){l='en';var n=navigator.languages||[navigator.language||''];for(var i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(L.indexOf(c)>=0){l=c;break;}}}var h=document.documentElement;h.lang=l;h.dir=(l==='fa'||l==='ar')?'rtl':'ltr';if(l!=='en'&&l!=='fa')document.write('<script src="lang-'+l+'.js?v=6"><\/script>');})();</script>
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg;}
:root{color-scheme:light dark;
  --bg:#FBF6EC;--bg2:#F4ECDD;--surf:#FFFFFF;--ink:#1F1712;--sub:#6F6459;--line:rgba(70,45,20,.14);--glass:255,252,246;--ga:.82;
  --accent:#B86E00;--shadow:0 1px 2px rgba(60,35,10,.06),0 18px 44px -22px rgba(60,35,10,.32);
  --saff:#E89A12;--saff2:#F6C04E;--pom:#C8364A;--herb:#2E8B57;--night:#0B0705;--night2:#140D09;--cream:#F5EEE5;--creamsub:#CDBBA8;
  --gold:linear-gradient(135deg,#FAD27A,#E8940F);
  --head:'Familjen Grotesk','Trebuchet MS',system-ui,sans-serif;--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.26,1);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100B08;--bg2:#17100C;--surf:#1C140F;--ink:#F4EDE4;--sub:#A99B8D;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.74;--accent:#F2B340;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--bg:#100B08;--bg2:#17100C;--surf:#1C140F;--ink:#F4EDE4;--sub:#A99B8D;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.74;--accent:#F2B340;--shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}
html[lang="fa"],html[lang="ar"]{--head:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--body:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--mono:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;}
html[lang="ru"]{--head:'Manrope','Segoe UI',system-ui,sans-serif;--body:'Manrope','Segoe UI',system-ui,sans-serif;}
html[dir="rtl"] body *{letter-spacing:0!important;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:90px;}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased;}
html[dir="rtl"] body{line-height:1.85;}
[hidden]{display:none!important;}
a{color:inherit;}button{font:inherit;color:inherit;cursor:pointer;}
img{display:block;max-width:100%;}
:focus-visible{outline:2px solid var(--saff2);outline-offset:3px;border-radius:8px;}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--surf);color:var(--ink);padding:10px 14px;border-radius:10px;}
.skip:focus{top:12px;}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.035em;line-height:1.04;text-wrap:balance;}
html[dir="rtl"] h1,html[dir="rtl"] h2{line-height:1.32;}
p{margin:0;}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:10px;margin:0 0 18px;}
html[dir="rtl"] .eyebrow{font-size:14px;}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--saff2);box-shadow:0 0 14px 2px rgba(246,192,78,.75);flex:none;}
.lead{font-size:clamp(17px,1.8vw,20px);color:var(--sub);max-width:58ch;margin-top:18px;}
.d2{font-size:clamp(34px,5vw,62px);}
section{position:relative;}
.pad{padding:clamp(80px,11vw,140px) 0;}
.dark{background:var(--night);color:var(--cream);--ink:#F5EEE5;--sub:#C9B8A6;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.6;--surf:#1C140F;--accent:#F6C04E;}
.light{background:var(--bg);color:var(--ink);}
.center{text-align:center;}.center .lead{margin-inline:auto;}.center .eyebrow{justify-content:center;}

/* ---------- floating header with sign in / sign up ---------- */
.nav{position:fixed;top:10px;left:10px;right:10px;z-index:60;max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 14px;
  padding-top:calc(7px + env(safe-area-inset-top,0px)*.3);border-radius:999px;background:rgba(18,12,8,.8);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  border:1px solid rgba(255,215,170,.14);color:var(--cream);box-shadow:0 20px 50px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .45s var(--ease),background .3s;}
html[dir="rtl"] .nav{padding:7px 14px 7px 7px;}
.nav.hide{transform:translateY(-130%);}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:18.5px;text-decoration:none;letter-spacing:-.02em;margin-inline-end:auto;white-space:nowrap;}
.brand svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 10px rgba(246,192,78,.35));}
.navlinks{display:flex;gap:2px;margin-inline-end:6px;}
.navlinks a{padding:8px 12px;border-radius:999px;text-decoration:none;font-size:14.5px;color:var(--creamsub);transition:color .2s,background .2s;}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.07);}
@media (max-width:940px){.navlinks{display:none;}}
.langwrap{position:relative;}
.langbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,215,170,.2);background:rgba(255,255,255,.05);font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.06em;color:var(--cream);}
.langbtn svg{width:16px;height:16px;}
.langbtn.busy{opacity:.55;pointer-events:none;}
.langmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;z-index:70;min-width:210px;padding:6px;border-radius:18px;background:#1C140F;color:var(--cream);border:1px solid rgba(255,215,170,.16);box-shadow:0 24px 60px -20px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:2px;animation:pop .22s var(--ease) both;}
.langopt{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:9px 12px;text-align:start;font-size:15px;}
.langopt span{flex:1;}.langopt:hover,.langopt:focus-visible{background:rgba(246,192,78,.16);outline:none;}
.langopt[aria-checked="true"]{font-weight:600;}.langopt[aria-checked="true"]::after{content:"✓";color:var(--saff2);}
.langopt small{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--creamsub);}
.langopt span[lang="fa"],.langopt span[lang="ar"]{font-family:'Vazirmatn',Tahoma,sans-serif;}.langopt span[lang="ru"]{font-family:'Manrope',system-ui,sans-serif;}
.nbtn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 15px;border-radius:999px;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:transform .2s var(--ease),background .2s,box-shadow .2s;}
.nbtn.in{border:1px solid rgba(255,215,170,.24);color:var(--cream);}
.nbtn.in:hover{background:rgba(255,255,255,.08);}
.nbtn.up{position:relative;overflow:hidden;background:var(--gold);color:#2B1900;box-shadow:0 8px 24px -8px rgba(232,148,15,.9);}
.nbtn.up:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(232,148,15,1);}
.nbtn.up::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite 1.5s;}
@keyframes shine{0%,70%{left:-60%;}100%{left:130%;}}
@media (max-width:460px){.brand span{display:none;}.nbtn{padding:0 12px;font-size:13.5px;}.langbtn{padding:0 9px;}.nav{gap:6px;}}
@media (max-width:400px){.langbtn span{display:none;}.langbtn{width:38px;padding:0;justify-content:center;}.nbtn{padding:0 10px;font-size:13px;}.nav{left:8px;right:8px;gap:5px;}}
@keyframes pop{from{opacity:0;transform:scale(.94);}}

/* ---------- buttons ---------- */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;border:0;background:var(--gold);color:#2B1900;font-weight:600;font-size:16.5px;text-decoration:none;white-space:nowrap;
  box-shadow:0 14px 38px -12px rgba(232,148,15,.85);transition:transform .25s var(--ease),box-shadow .25s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 48px -14px rgba(232,148,15,.95);}
.cta svg{width:16px;height:16px;}html[dir="rtl"] .cta svg{transform:scaleX(-1);}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 24px;border-radius:999px;border:1px solid var(--line);color:inherit;text-decoration:none;font-weight:500;background:none;transition:border-color .2s,transform .2s;}
.ghost:hover{border-color:currentColor;transform:translateY(-1px);}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;padding:112px 0 48px;color:var(--cream);overflow:hidden;isolation:isolate;display:flex;align-items:center;
  background:radial-gradient(900px 620px at 78% 30%,rgba(200,54,74,.30),transparent 62%),radial-gradient(760px 560px at 8% 90%,rgba(46,139,87,.22),transparent 62%),radial-gradient(900px 520px at 55% 115%,rgba(232,154,18,.34),transparent 62%),var(--night);}
.hero>.wrap{width:100%;}
#dust{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;}
.floor{position:absolute;left:-40%;right:-40%;bottom:-6%;height:52%;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,205,150,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,205,150,.10) 1px,transparent 1px);background-size:70px 70px;
  transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 78%);mask-image:linear-gradient(to top,#000 5%,transparent 78%);animation:floor 5s linear infinite;}
@keyframes floor{to{background-position:0 70px;}}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:clamp(20px,4vw,56px);align-items:center;}
@media (max-width:1000px){.hgrid{grid-template-columns:1fr;}}
.hcopy{position:relative;z-index:2;}
.hero .eyebrow{color:#E9D6BF;}
.hero .eyebrow{margin-bottom:16px;}
@media (max-width:520px){.hero .eyebrow{letter-spacing:.1em;font-size:10.5px;}}
.hero .eyebrow .chipline{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,170,.18);}
.mega{font-size:clamp(38px,4.7vw,70px);line-height:1;letter-spacing:-.045em;}
html[dir="rtl"] .mega{line-height:1.25;}
.mega .w{display:inline-block;transform-origin:50% 100%;animation:wordIn 1.1s var(--ease) both;animation-delay:calc(var(--i) * 65ms + .1s);}
.mega .w.hl{background:linear-gradient(100deg,#FFE7AE,#F6C04E 35%,#F0864A 70%,#E0556A);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em;}
@keyframes wordIn{from{opacity:0;transform:perspective(700px) rotateX(-85deg) translateY(.4em);filter:blur(10px);}}
.hero .lead{color:#DCCBB8;max-width:52ch;font-size:clamp(16.5px,1.5vw,19px);margin-top:16px;animation:fadeUp 1s var(--ease) .55s both;}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,22px,0);}}
.hero .auth,.hero .tryline{animation:fadeUp 1s var(--ease) .75s both;}
.tryline{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:#E9D6BF;font-size:14.5px;text-decoration:none;border-bottom:1px dashed rgba(255,215,170,.35);padding-bottom:2px;}
.tryline:hover{color:#fff;border-color:#fff;}
.tryline svg{width:14px;height:14px;}

/* ---------- the sign up / sign in card ---------- */
.auth{position:relative;margin-top:22px;max-width:500px;border-radius:26px;padding:18px;color:var(--cream);
  background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 60%);border:1px solid rgba(255,215,170,.16);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 40px 90px -34px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.14);transform-style:preserve-3d;transition:transform .5s var(--ease);}
.auth::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 55%,#F6C04E 70%,#E0556A 82%,#2E8B57 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 7s linear infinite;}
@keyframes ang{to{--ang:360deg;}}
.atabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(0,0,0,.32);border:1px solid rgba(255,215,170,.1);}
.atabs button{position:relative;z-index:1;height:38px;border:0;background:none;border-radius:999px;font-weight:600;font-size:14.5px;color:#D6C4B0;transition:color .3s;}
.atabs button[aria-pressed="true"]{color:#2B1900;}
.atabs .knob{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;border-radius:999px;background:var(--gold);box-shadow:0 6px 18px -6px rgba(232,148,15,.9);transition:transform .45s var(--ease);}
.atabs[data-m="in"] .knob{transform:translateX(100%);}
html[dir="rtl"] .atabs[data-m="in"] .knob{transform:translateX(-100%);}
.auth h2{font-size:clamp(20px,2.2vw,24px);margin:16px 4px 12px;letter-spacing:-.02em;}
.aform{display:flex;gap:8px;}
.aform input{flex:1;min-width:0;height:52px;font:inherit;font-size:16.5px;padding:0 16px;border-radius:16px;border:1px solid rgba(255,215,170,.22);background:rgba(0,0,0,.28);color:#fff;transition:border-color .2s,box-shadow .2s;}
.aform input::placeholder{color:#A8978A;}
.aform input:focus{outline:none;border-color:#F6C04E;box-shadow:0 0 0 4px rgba(246,192,78,.2);}
.aform button{flex:none;height:52px;padding:0 20px;border-radius:16px;border:0;background:var(--gold);color:#2B1900;font-weight:700;font-size:15.5px;box-shadow:0 10px 26px -10px rgba(232,148,15,.95);transition:transform .2s var(--ease);}
.aform button:hover{transform:translateY(-1px);}
@media (max-width:520px){.aform{flex-direction:column;}.aform input{flex:none;width:100%;}.aform button{width:100%;}}
.aor{display:flex;align-items:center;gap:12px;margin:12px 0;color:#A8978A;font-size:13px;}
.aor::before,.aor::after{content:"";flex:1;height:1px;background:rgba(255,215,170,.14);}
.agoogle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:16px;border:1px solid rgba(255,215,170,.2);background:rgba(255,255,255,.06);font-weight:600;font-size:15px;text-decoration:none;color:#fff;transition:background .2s;}
.agoogle:hover{background:rgba(255,255,255,.12);}
.agoogle svg{width:18px;height:18px;}
.afine{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:13px;color:#BFAE9C;}
.afine svg{width:15px;height:15px;flex:none;color:#7BE0A6;}
.amsg{margin:8px 4px 0;font-size:13.5px;color:#FF9D8C;}
.auth.shake{animation:shake .45s;}
@keyframes shake{20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.auth .signed{display:flex;flex-direction:column;gap:10px;padding:6px 4px;}
.auth .signed p{color:#D6C4B0;}

/* ---------- 3D orbit of dish photos ---------- */
.stage{position:relative;height:clamp(360px,44vw,560px);perspective:1100px;perspective-origin:50% 30%;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;animation:fadeIn 1.4s var(--ease) .3s both;}
@keyframes fadeIn{from{opacity:0;}}
.stage.drag{cursor:grabbing;}
.halo{position:absolute;left:50%;top:50%;width:min(78%,440px);aspect-ratio:1;transform:translate(-50%,-50%) rotateX(72deg);border-radius:50%;pointer-events:none;
  background:conic-gradient(from var(--ang),rgba(246,192,78,.0),rgba(246,192,78,.55),rgba(224,85,106,.5),rgba(46,139,87,.45),rgba(246,192,78,.0));filter:blur(18px);opacity:.75;animation:ang 12s linear infinite;}
.halo::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--night);filter:blur(12px);}
.pedestal{position:absolute;left:50%;top:76%;width:min(92%,560px);height:90px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(246,192,78,.28),rgba(232,148,15,.08) 60%,transparent);filter:blur(4px);}
.ring{position:absolute;left:50%;top:47%;width:0;height:0;transform-style:preserve-3d;}
.ccard{--cw:158px;position:absolute;left:calc(var(--cw) / -2);top:calc(var(--cw) * -.66);width:var(--cw);height:calc(var(--cw) * 1.32);border-radius:22px;overflow:hidden;background:#24180F;color:#fff;text-decoration:none;
  box-shadow:0 30px 50px -22px rgba(0,0,0,.9),0 0 0 1px rgba(255,215,170,.14);will-change:transform,opacity;-webkit-user-drag:none;}
.ccard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
.ccard::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(8,4,2,.82));}
.ccard::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);opacity:var(--gl,0);mix-blend-mode:screen;}
.ccard .cm{position:absolute;left:12px;right:12px;bottom:11px;z-index:3;display:flex;flex-direction:column;gap:2px;}
.ccard .cm b{font-family:var(--head);font-size:16px;line-height:1.15;font-weight:650;text-shadow:0 1px 8px rgba(0,0,0,.6);}
.ccard .cm small{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#F3DDBF;opacity:.9;}
.ccard .dk{position:absolute;inset:0;z-index:5;background:#0B0705;opacity:var(--dk,0);pointer-events:none;}
.ccard .ctag{position:absolute;top:10px;inset-inline-start:10px;z-index:3;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(10,6,3,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);}
.ccard:focus-visible{outline:3px solid #F6C04E;outline-offset:3px;}
@media (max-width:560px){.ccard{--cw:118px;border-radius:18px;}.ccard .cm b{font-size:13.5px;}.ccard .cm small{font-size:9.5px;}}
.hchip{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;pointer-events:none;
  background:rgba(24,16,11,.62);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,215,170,.18);box-shadow:0 18px 40px -18px rgba(0,0,0,.9);animation:bob 6s ease-in-out infinite;}
.hchip.c1{top:9%;inset-inline-start:6%;}.hchip.c2{top:17%;inset-inline-end:0;animation-delay:-2s;}.hchip.c3{bottom:1%;inset-inline-end:3%;animation-delay:-4s;}

.draghint{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#CDBBA8;

/* ---------- stats ---------- */
.stats{padding:clamp(44px,6vw,70px) 0;border-top:1px solid rgba(255,215,170,.08);border-bottom:1px solid rgba(255,215,170,.08);
  background:linear-gradient(180deg,var(--night),#120B07);}

.stat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}

  text-shadow:0 1px 0 #E9A93A,0 2px 0 #D7952A,0 3px 0 #C3811F,0 4px 0 #AE6E16,0 5px 0 #985C0F,0 6px 0 #824B0A,0 7px 0 #6C3B07,0 18px 28px rgba(0,0,0,.6),0 0 40px rgba(246,192,78,.25);
  transform:perspective(500px) rotateX(18deg);}
#st4{font-size:clamp(30px,4.6vw,64px);padding-top:.12em;}
.stat span{color:#CDBBA8;font-size:14.5px;max-width:20ch;}

/* ---------- 3D wall of photos ---------- */
.wall{position:relative;height:clamp(300px,38vw,500px);overflow:hidden;background:var(--night);perspective:1100px;}
.wall::before,.wall::after{content:"";position:absolute;left:0;right:0;height:30%;z-index:2;pointer-events:none;}

.wall3d{position:absolute;left:50%;top:50%;width:170%;display:flex;flex-direction:column;gap:16px;transform:translate(-50%,-50%) rotateX(32deg) rotateZ(-11deg);transform-style:preserve-3d;}
html[dir="rtl"] .wall3d{transform:translate(-50%,-50%) rotateX(32deg) rotateZ(11deg);}
.wrow{overflow:visible;}
.track{display:flex;gap:16px;width:max-content;animation:mq 80s linear infinite;}

.tile{position:relative;flex:none;width:clamp(170px,19vw,250px);aspect-ratio:1.45;border-radius:18px;overflow:hidden;background:#24180F;box-shadow:0 24px 40px -20px rgba(0,0,0,.8);}
.tile img{width:100%;height:100%;object-fit:cover;}
.tile span{position:absolute;left:10px;bottom:8px;right:10px;font-family:var(--head);font-weight:600;font-size:14px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.8);}

/* ---------- try it ---------- */
.trybox{margin-top:34px;border-radius:30px;padding:clamp(18px,3vw,30px);background:#140E0A;color:var(--cream);border:1px solid rgba(255,215,170,.12);box-shadow:0 40px 90px -40px rgba(20,10,4,.8);position:relative;overflow:hidden;isolation:isolate;--sub:#C9B8A6;--line:rgba(255,215,170,.14);--glass:30,22,16;--surf:#1C140F;}
.trybox::before{content:"";position:absolute;left:-30%;top:-70%;width:160%;height:220%;z-index:-1;background:conic-gradient(from 0deg,rgba(246,192,78,.3),rgba(200,54,74,.22),rgba(46,139,87,.22),rgba(246,192,78,.3));filter:blur(70px);opacity:.5;animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.say{display:flex;gap:10px;}
.say input{flex:1;min-width:0;font:inherit;font-size:18px;padding:15px 18px;border-radius:18px;border:1px solid rgba(255,215,170,.22);background:rgba(255,255,255,.07);color:#fff;}
.say input::placeholder{color:#BFAE9C;}
.say input:focus{outline:none;border-color:#F6C04E;box-shadow:0 0 0 4px rgba(246,192,78,.2);}
.say button{flex:none;height:56px;padding:0 22px;border-radius:18px;border:0;background:var(--gold);color:#2B1900;font-weight:600;}
@media (max-width:560px){.say{flex-direction:column;}.say button{width:100%;}}
.tryx{margin-top:12px;background:none;border:0;color:#D6C6B4;text-decoration:underline;text-underline-offset:3px;font-size:14.5px;padding:4px 0;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,215,170,.18);animation:pop .35s var(--ease) both;}
.chip button{background:none;border:0;padding:0;color:#C9B8A6;font-size:16px;line-height:1;}
.trystats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.tstat{flex:1 1 200px;border-radius:16px;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,170,.12);}
.tstat b{display:block;font-family:var(--head);font-size:30px;line-height:1;}
.tstat.ready b{color:#7BE0A6;}.tstat.almost b{color:#F6C04E;}
.tstat span{font-size:13.5px;color:#C9B8A6;}
.tryres{margin-top:18px;}
.tryfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:20px;font-size:13.5px;color:#C9B8A6;}
.tryfoot a{color:#F6C04E;font-weight:600;text-decoration:none;}

/* ---------- recipe cards with photos ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
@media (max-width:520px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}}
.rcard{position:relative;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:rgba(var(--glass),var(--ga));box-shadow:var(--shadow);text-decoration:none;color:inherit;
  transition:transform .35s var(--ease),box-shadow .35s;animation:rise .7s var(--ease) both;transform-style:preserve-3d;will-change:transform;}
.rcard:hover{transform:translateY(-4px);}
@keyframes rise{from{opacity:0;transform:translate3d(0,24px,0);}}
.plate{position:relative;aspect-ratio:1.4;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--dc) 35%,transparent),transparent 70%),color-mix(in srgb,var(--dc) 14%,var(--surf));}
.plate::before{content:"";width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--dc) 92%,#000) 0 44%,color-mix(in srgb,var(--dc) 70%,#fff) 45% 49%,#FFFDF8 50% 66%,#EFE6D8 67% 70%,transparent 71%);
  box-shadow:0 18px 30px -14px rgba(40,20,5,.55);transform:translateY(8px) rotate(-8deg);transition:transform .6s var(--ease),opacity .5s .15s;}

.plate .fa{position:absolute;bottom:9px;inset-inline-end:12px;z-index:1;font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;font-size:15px;color:color-mix(in srgb,var(--dc) 70%,var(--ink));direction:rtl;}
.plate.in .fa{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7);}
.plate .cu{position:absolute;top:10px;inset-inline-start:10px;z-index:1;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(10,6,3,.5);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.rbody b{font-family:var(--head);font-weight:600;font-size:16.5px;line-height:1.25;}
.rmeta{font-family:var(--mono);font-size:11.5px;color:var(--sub);}
.badge{align-self:flex-start;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin-top:auto;}
.badge.ready{background:color-mix(in srgb,#2E8B57 22%,transparent);color:#7BE0A6;}
.badge.miss{background:color-mix(in srgb,#E89A12 20%,transparent);color:#F6C04E;}
.light .badge.ready{color:var(--herb);}.light .badge.miss{color:#9A5D00;}
.tilting{transition:transform .12s linear,box-shadow .3s!important;}
.rcard.tilting{box-shadow:0 34px 60px -30px rgba(40,20,5,.6),var(--shadow);}
.shine{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.22),transparent 42%);}
.tilting>.shine{opacity:1;}

/* ---------- feature bento ---------- */
.features{background:radial-gradient(900px 500px at 10% 0%,rgba(200,54,74,.16),transparent 60%),radial-gradient(900px 600px at 100% 100%,rgba(46,139,87,.14),transparent 60%),var(--night);}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:44px;}
.fcard{position:relative;grid-column:span 4;border-radius:28px;padding:24px;overflow:hidden;isolation:isolate;min-height:300px;display:flex;flex-direction:column;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.02) 55%);border:1px solid rgba(255,215,170,.12);box-shadow:0 30px 70px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
  transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .4s;}

.fcard h3{font-size:clamp(21px,2.1vw,26px);letter-spacing:-.025em;margin-bottom:8px;transform:translateZ(30px);}

.fic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px;color:#2B1900;background:var(--gold);box-shadow:0 10px 24px -10px rgba(232,148,15,.9);transform:translateZ(40px);}
.fic svg{width:22px;height:22px;}
.fic.pom{background:linear-gradient(135deg,#FF8A9B,#C8364A);color:#fff;box-shadow:0 10px 24px -10px rgba(200,54,74,.9);}
.fic.herb{background:linear-gradient(135deg,#8FE3B2,#2E8B57);color:#062413;box-shadow:0 10px 24px -10px rgba(46,139,87,.9);}
.mock{margin-top:auto;padding-top:20px;transform:translateZ(50px);transform-style:preserve-3d;}
/* scan mock */
.scan{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:2.5;background:#24180F;}
.scan img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1);}
.scan .beam{position:absolute;left:0;right:0;height:34%;top:-34%;background:linear-gradient(180deg,transparent,rgba(123,224,166,.35) 80%,rgba(160,255,200,.9) 100%);animation:beam 3.2s cubic-bezier(.5,0,.5,1) infinite;mix-blend-mode:screen;}
@keyframes beam{to{top:100%;}}
@media (max-width:640px){.scan{aspect-ratio:1.6;}}
.scan .box{position:absolute;border:2px solid #7BE0A6;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 18px rgba(123,224,166,.5);animation:boxIn 3.2s ease-in-out infinite;}

.found{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;}
.found .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7BE0A6;margin-inline-end:4px;}

/* plate mock */
.pmock{display:flex;align-items:center;gap:18px;}

.pmock .dish img{width:100%;height:100%;object-fit:cover;}

.macros{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0;}

.mbar{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:#C9B8A6;}
.mbar i{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;}

html[dir="rtl"] .mbar i::after{right:0;left:auto;transform-origin:right;}

/* segmented demo */
.seg{display:flex;width:100%;padding:4px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,215,170,.12);position:relative;max-width:100%;}

.seg span.on{color:#2B1900;}
.seg .knob{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;border-radius:999px;background:var(--gold);transition:transform .5s var(--ease),width .5s var(--ease);}
.mlist{display:flex;flex-direction:column;gap:7px;margin-top:14px;min-height:118px;}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,215,170,.1);font-size:14px;animation:pop .45s var(--ease) both;}

.mrow .tag.ok{background:rgba(46,139,87,.25);color:#7BE0A6;}.mrow .tag.buy{background:rgba(246,192,78,.2);color:#F6C04E;}
/* cuisine fan */
.fan{position:relative;height:150px;margin-top:16px;perspective:900px;}
.fan .ph{position:absolute;top:8px;left:50%;width:104px;height:134px;margin-left:-52px;border-radius:16px;overflow:hidden;box-shadow:0 20px 34px -14px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.12);transition:transform .8s var(--ease),opacity .5s;}
.fan .ph img{width:100%;height:100%;object-fit:cover;}
.fan .ph:nth-child(1){transform:translateX(-78px) rotateY(28deg) rotateZ(-8deg) translateZ(-30px);}
.fan .ph:nth-child(2){transform:translateZ(20px);z-index:2;}
.fan .ph:nth-child(3){transform:translateX(78px) rotateY(-28deg) rotateZ(8deg) translateZ(-30px);}

/* doneness demo */
.done{display:flex;gap:16px;align-items:center;}

.tring svg{width:100%;height:100%;transform:rotate(-90deg);}

.tring .bg{stroke:rgba(255,255,255,.08);}.tring .fg{stroke:url(#tg);stroke-linecap:round;stroke-dasharray:264;animation:tdash 9s linear infinite;}
@keyframes tdash{from{stroke-dashoffset:0;}to{stroke-dashoffset:264;}}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:21px;direction:ltr;}
.drows{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.drow{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:12px;border:1px solid transparent;opacity:.5;transition:opacity .4s,background .4s,border-color .4s;}

.msg ol{margin:4px 0 0;padding-inline-start:20px;}.msg li{margin:4px 0;}
.rchip{display:inline-block;border:1px solid rgba(246,192,78,.45);background:rgba(246,192,78,.15);border-radius:999px;padding:0 9px;font-weight:600;font-size:.93em;text-decoration:none;color:inherit;}

.pitem{display:flex;align-items:center;gap:12px;margin-top:8px;padding:9px 12px;border-radius:14px;border:1px solid rgba(255,215,170,.14);background:rgba(255,255,255,.04);animation:pop .4s var(--ease) both;}

.egg{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.egg .one{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,215,170,.2);font-weight:600;}
.egg .one svg{width:30px;height:30px;}
.egg .arrow{color:#F6C04E;}
html[dir="rtl"] .egg .arrow{transform:scaleX(-1);}
.eggs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.eggs a{position:relative;aspect-ratio:1.1;border-radius:14px;overflow:hidden;text-decoration:none;color:#fff;background:#24180F;box-shadow:0 14px 24px -14px rgba(0,0,0,.9);transition:transform .3s var(--ease);}
.eggs a:hover{transform:translateY(-3px) rotate(-1deg);}
.eggs img{width:100%;height:100%;object-fit:cover;}
.eggs span{position:absolute;left:7px;right:7px;bottom:6px;font-size:12px;font-weight:600;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.9);z-index:1;}
.eggs a::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.7));}

/* ---------- gallery ---------- */
.gfilters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:30px -2px 16px;scrollbar-width:none;}
.gfilters::-webkit-scrollbar{display:none;}
.gchip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--glass),.7);font-size:14.5px;font-weight:500;color:var(--ink);transition:background .2s,border-color .2s,transform .2s;}
.gchip:hover{transform:translateY(-1px);border-color:var(--accent);}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.gchip small{opacity:.6;margin-inline-start:6px;font-family:var(--mono);font-size:11px;}
.gfoot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px;}
.light .ghost{border-color:var(--line);}

/* ---------- showcase: a phone in 3D ---------- */
.show{background:radial-gradient(70% 60% at 30% 40%,rgba(200,54,74,.2),transparent 60%),radial-gradient(60% 50% at 80% 80%,rgba(232,154,18,.14),transparent 60%),var(--night);overflow:hidden;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center;}
@media (max-width:900px){.split{grid-template-columns:1fr;}}
.pscene{perspective:1600px;display:flex;justify-content:center;padding:20px 0;}
.phone{position:relative;width:min(330px,84vw);border-radius:46px;padding:12px;background:linear-gradient(145deg,#3a2b21,#120b07 60%);
  transform:rotateY(var(--ry,-24deg)) rotateX(var(--rx,10deg)) rotateZ(var(--rz,3deg));transform-style:preserve-3d;transition:transform .2s linear;
  box-shadow:1px 1px 0 #2e2118,2px 2px 0 #2b1f16,3px 3px 0 #281d14,4px 4px 0 #251a12,5px 5px 0 #221810,6px 6px 0 #1f160f,7px 7px 0 #1c140d,8px 8px 0 #19120c,9px 9px 0 #16100a,10px 10px 0 #140e09,40px 60px 90px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,215,170,.1) inset;}
html[dir="rtl"] .phone{box-shadow:-1px 1px 0 #2e2118,-2px 2px 0 #2b1f16,-3px 3px 0 #281d14,-4px 4px 0 #251a12,-5px 5px 0 #221810,-6px 6px 0 #1f160f,-7px 7px 0 #1c140d,-8px 8px 0 #19120c,-9px 9px 0 #16100a,-10px 10px 0 #140e09,-40px 60px 90px -20px rgba(0,0,0,.85);}
.phone::before{content:"";position:absolute;top:22px;left:50%;width:84px;height:24px;margin-left:-42px;border-radius:99px;background:#050302;z-index:3;}
.screen{position:relative;border-radius:36px;overflow:hidden;background:#150E0A;padding:52px 18px 20px;min-height:600px;color:var(--cream);}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.1),transparent 35%);}
.livepill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:99px;background:rgba(200,54,74,.16);color:#FF9DAA;font-family:var(--mono);font-size:11px;letter-spacing:.16em;}
.livepill i{width:7px;height:7px;border-radius:50%;background:#FF4D6A;box-shadow:0 0 10px #FF4D6A;animation:blink 1.1s ease-in-out infinite;}
.timer{font-family:var(--head);font-weight:700;font-size:62px;letter-spacing:-.05em;line-height:.95;margin:14px 0 2px;background:linear-gradient(180deg,#fff 30%,#FFD98A);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;text-align:start;}
html[dir="rtl"] .timer{text-align:right;}
.timerlbl{color:#C9B8A6;font-size:13px;}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;}.bar i{display:block;height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,#E8940F,#F6C04E);}
html[dir="rtl"] .bar i{margin-inline-start:auto;}
.now{margin-top:14px;padding:13px;border-radius:18px;border:1px solid rgba(246,192,78,.4);background:rgba(246,192,78,.08);font-size:14px;}
.now b,.next b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#F6C04E;margin-bottom:5px;}
.next{margin-top:8px;padding:11px 13px;border-radius:16px;border:1px solid rgba(255,215,170,.14);color:#C9B8A6;font-size:13.5px;}
.next b{color:#C9B8A6;}
.screen .drows{margin-top:10px;}
.screen .dhd{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#C9B8A6;margin-top:14px;}
.points{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:12px;}
.points li{display:flex;gap:12px;align-items:flex-start;color:#E4D4C2;}
.points li::before{content:"";width:22px;height:22px;flex:none;border-radius:50%;margin-top:3px;background:radial-gradient(circle,#F6C04E 0 30%,rgba(246,192,78,.2) 32%);}
.show .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;}
.show .ghost{border-color:rgba(255,215,170,.3);}

/* ---------- languages ---------- */
.langs{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;justify-content:center;}
.lchip{border-radius:999px;padding:12px 20px;font-size:clamp(17px,2vw,22px);border:1px solid var(--line);background:rgba(var(--glass),.7);color:var(--ink);transition:background .2s,border-color .2s,transform .25s var(--ease);box-shadow:var(--shadow);}
.lchip:hover{transform:translateY(-3px) rotate(-1deg);border-color:var(--accent);}
.lchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.lchip[lang="fa"],.lchip[lang="ar"]{font-family:'Vazirmatn',Tahoma,sans-serif;}.lchip[lang="ru"]{font-family:'Manrope',system-ui,sans-serif;}

/* ---------- faq ---------- */
.faq{background:var(--bg2);}
.faqs{max-width:820px;margin:36px auto 0;display:flex;flex-direction:column;gap:10px;}
.faqs details{border-radius:20px;border:1px solid var(--line);background:rgba(var(--glass),var(--ga));box-shadow:var(--shadow);overflow:hidden;}
.faqs summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 20px;font-family:var(--head);font-weight:600;font-size:clamp(17px,1.8vw,19.5px);letter-spacing:-.01em;}
.faqs summary::-webkit-details-marker{display:none;}
.faqs summary::after{content:"";margin-inline-start:auto;flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:linear-gradient(currentColor,currentColor) center/12px 1.8px no-repeat,linear-gradient(currentColor,currentColor) center/1.8px 12px no-repeat;transition:transform .35s var(--ease);}
.faqs details[open] summary::after{transform:rotate(135deg);}
.faqs details p{padding:0 20px 20px;color:var(--sub);max-width:70ch;}

/* ---------- final call ---------- */
.end{overflow:hidden;background:radial-gradient(800px 500px at 50% 0%,rgba(232,154,18,.26),transparent 62%),radial-gradient(600px 400px at 10% 100%,rgba(200,54,74,.2),transparent 60%),var(--night);}
.end .auth{margin:30px auto 0;}
.end .wrap{position:relative;z-index:1;}
.end .wrap>h2{max-width:14ch;margin-inline:auto;}
.float{position:absolute;width:clamp(110px,13vw,170px);aspect-ratio:.8;border-radius:22px;overflow:hidden;box-shadow:0 40px 60px -24px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.12);pointer-events:none;animation:bob 7s ease-in-out infinite;}
.float img{width:100%;height:100%;object-fit:cover;}
.float.a{left:3%;top:14%;transform:rotate(-12deg);}
.float.b{right:3%;top:18%;transform:rotate(10deg);animation-delay:-2s;}
.float.c{left:7%;bottom:12%;transform:rotate(8deg);animation-delay:-4s;}
.float.d{right:7%;bottom:10%;transform:rotate(-9deg);animation-delay:-5.5s;}
@media (max-width:1180px){.float{width:110px;}.float.a,.float.c{left:1.5%;}.float.b,.float.d{right:1.5%;}}
@keyframes bob{50%{translate:0 -16px;}}
@media (max-width:900px){.float{display:none;}}

footer{background:var(--night);color:#CDBBA8;padding:40px 0 calc(46px + env(safe-area-inset-bottom,0px));font-size:13.5px;border-top:1px solid rgba(255,215,170,.08);}
.frow{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;}
.frow .brand{color:var(--cream);margin:0;}
.flinks{display:flex;gap:16px;flex-wrap:wrap;}
.flinks a{text-decoration:none;color:#E4D4C2;}.flinks a:hover{color:#fff;text-decoration:underline;}
.fnote{margin-top:18px;display:flex;flex-direction:column;gap:6px;color:#A8978A;}
.fnote a{color:#CDBBA8;}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translate3d(0,26px,0);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.rv.in{opacity:1;transform:none;}
.rv.s1{transition-delay:.08s;}.rv.s2{transition-delay:.16s;}.rv.s3{transition-delay:.24s;}
.fcard.rv{transform:perspective(900px) rotateX(14deg) translate3d(0,40px,0);}
.fcard.rv.in{transform:none;}
@media (prefers-reduced-motion:reduce){.rv,.fcard.rv{opacity:1;transform:none;transition:none;}*{animation-duration:.001s!important;animation-iteration-count:1!important;}.track{animation:none!important;}}
</style>
