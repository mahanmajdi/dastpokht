<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>Dastpokht · Cook with what you have</title>
<meta name="description" content="Tell Dastpokht what’s in your kitchen and it shows you what to cook — Persian home cooking, full meals timed to the minute, a kitchen assistant, and recipes from other cooks. In 8 languages.">
<meta name="theme-color" content="#0F0B08">
<meta property="og:title" content="Dastpokht · Cook with what you have">
<meta property="og:description" content="Say what’s in your kitchen. See what you can cook tonight — Persian home cooking, whole meals on time, in 8 languages.">
<meta property="og:image" content="https://mahanmajdi.github.io/macro/og.jpg">
<meta property="og:type" content="website">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..600&family=Vazirmatn:wght@300..800&family=Manrope:wght@400..800&display=swap">
<script>(function(){var L=['en','fa','ar','tr','es','fr','de','ru'],l=null;try{l=localStorage.getItem('dp.lang');}catch(e){}if(L.indexOf(l)<0){l='en';var n=navigator.languages||[navigator.language||''];for(var i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(L.indexOf(c)>=0){l=c;break;}}}var h=document.documentElement;h.lang=l;h.dir=(l==='fa'||l==='ar')?'rtl':'ltr';if(l!=='en'&&l!=='fa')document.write('<script src="lang-'+l+'.js?v=3"><\/script>');})();</script>
<style>
:root{color-scheme:light dark;
  --bg:#FBF6EC;--surf:#FFFFFF;--ink:#1F1712;--sub:#6F6459;--line:rgba(70,45,20,.14);--glass:255,252,246;--ga:.82;
  --accent:#B86E00;--over:#C13F2B;--shadow:0 1px 2px rgba(60,35,10,.06),0 18px 44px -22px rgba(60,35,10,.32);
  --saff:#E89A12;--saff2:#F6C04E;--pom:#C8364A;--herb:#2E8B57;
  --head:'Familjen Grotesk','Trebuchet MS',system-ui,sans-serif;--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.26,1);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0B08;--surf:#1A130E;--ink:#F4EDE4;--sub:#A99B8D;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.74;--accent:#F2B340;--over:#F07A64;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--bg:#0F0B08;--surf:#1A130E;--ink:#F4EDE4;--sub:#A99B8D;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.74;--accent:#F2B340;--over:#F07A64;}
html[lang="fa"],html[lang="ar"]{--head:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--body:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--mono:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;}
html[lang="ru"]{--head:'Manrope','Segoe UI',system-ui,sans-serif;--body:'Manrope','Segoe UI',system-ui,sans-serif;}
html[dir="rtl"] body *{letter-spacing:0!important;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased;}
html[dir="rtl"] body{line-height:1.85;}
[hidden]{display:none!important;}
a{color:inherit;}button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--surf);padding:10px 14px;border-radius:10px;}
.skip:focus{top:12px;}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.03em;line-height:1.04;text-wrap:balance;}
html[dir="rtl"] h1,html[dir="rtl"] h2{line-height:1.3;}
p{margin:0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:10px;margin:0 0 18px;}
html[dir="rtl"] .eyebrow{font-size:14px;}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--saff2);box-shadow:0 0 14px 2px rgba(246,192,78,.75);}
.lead{font-size:clamp(17px,1.9vw,20px);color:var(--sub);max-width:58ch;margin-top:20px;}
.d2{font-size:clamp(34px,5.2vw,64px);}
/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 22px;padding-top:calc(12px + env(safe-area-inset-top,0px));transition:background .4s,border-color .4s;border-bottom:1px solid transparent;color:#F5EEE5;}
.nav.solid{background:rgba(var(--glass),.82);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom-color:var(--line);color:var(--ink);}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:19px;text-decoration:none;letter-spacing:-.02em;margin-inline-end:auto;}
.brand svg{width:26px;height:26px;}
.langwrap{position:relative;}
.langbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,215,170,.28);background:rgba(255,255,255,.06);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;}
.nav.solid .langbtn{border-color:var(--line);background:rgba(var(--glass),.6);}
.langbtn svg{width:16px;height:16px;}
.langbtn.busy{opacity:.55;pointer-events:none;}
.langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:60;min-width:210px;padding:6px;border-radius:18px;background:var(--surf);color:var(--ink);border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(20,10,4,.55);display:flex;flex-direction:column;gap:2px;animation:pop .22s var(--ease) both;}
.langopt{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:9px 12px;text-align:start;font-size:15px;}
.langopt span{flex:1;}.langopt:hover,.langopt:focus-visible{background:rgba(246,192,78,.16);outline:none;}
.langopt[aria-checked="true"]{font-weight:600;}.langopt[aria-checked="true"]::after{content:"✓";color:var(--accent);}
.langopt small{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);}
.langopt span[lang="fa"],.langopt span[lang="ar"]{font-family:'Vazirmatn',Tahoma,sans-serif;}.langopt span[lang="ru"]{font-family:'Manrope',system-ui,sans-serif;}
.navcta{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;background:linear-gradient(135deg,#F8C85A,#E8940F);color:#2B1900;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap;}
@keyframes pop{from{opacity:0;transform:scale(.94);}}
/* buttons */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 28px;border-radius:999px;border:0;background:linear-gradient(135deg,#F8C85A,#E8940F);color:#2B1900;font-weight:600;font-size:17px;text-decoration:none;white-space:nowrap;
  box-shadow:0 14px 38px -12px rgba(232,148,15,.85);transition:transform .25s var(--ease),box-shadow .25s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 48px -14px rgba(232,148,15,.95);}
.cta svg{width:16px;height:16px;}html[dir="rtl"] .cta svg{transform:scaleX(-1);}
.ghost{display:inline-flex;align-items:center;height:56px;padding:0 24px;border-radius:999px;border:1px solid rgba(255,215,170,.3);color:inherit;text-decoration:none;font-weight:500;transition:border-color .2s,transform .2s;}
.ghost:hover{border-color:currentColor;transform:translateY(-1px);}
.light .ghost{border-color:var(--line);}
/* chapters */
section{position:relative;z-index:1;}
.dark{background:#0E0906;color:#F5EEE5;--ink:#F5EEE5;--sub:#C9B8A6;--line:rgba(255,215,170,.14);--glass:30,22,16;--surf:#1A130E;--accent:#F6C04E;}
.light{background:var(--bg);}
.pad{padding:clamp(80px,12vw,150px) 0;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center;}
@media (max-width:880px){.split{grid-template-columns:1fr;}}
/* hero */
#stage3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .6s;background:#0E0906;}
.hero .wrap{width:100%;}
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;background:transparent;color:#F5EEE5;--sub:#D6C6B4;padding:120px 0 80px;}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(14,9,6,.88) 0,rgba(14,9,6,.55) 45%,rgba(14,9,6,0) 75%),linear-gradient(0deg,#0E0906 0,rgba(14,9,6,0) 22%);}
html[dir="rtl"] .hero::before{background:linear-gradient(270deg,rgba(14,9,6,.88) 0,rgba(14,9,6,.55) 45%,rgba(14,9,6,0) 75%),linear-gradient(0deg,#0E0906 0,rgba(14,9,6,0) 22%);}
.hero .inner{max-width:640px;}
.hero h1{font-size:clamp(44px,7.4vw,96px);}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;}
.hpoints{display:flex;gap:10px 22px;flex-wrap:wrap;margin:38px 0 0;padding:0;list-style:none;font-size:14.5px;color:#D6C6B4;}
.hpoints li{display:flex;align-items:center;gap:8px;}.hpoints li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--saff2);}
@media (max-width:760px){.hero{align-items:flex-end;padding-top:56vh;}.hero::before,html[dir="rtl"] .hero::before{background:linear-gradient(180deg,rgba(14,9,6,0) 30%,rgba(14,9,6,.94) 60%);}}
/* try it */
.try{background:linear-gradient(180deg,#0E0906 0,var(--bg) 1px);}
.trybox{margin-top:34px;border-radius:30px;padding:clamp(18px,3vw,30px);background:#140E0A;color:#F5EEE5;border:1px solid rgba(255,215,170,.12);box-shadow:0 40px 90px -40px rgba(20,10,4,.8);position:relative;overflow:hidden;isolation:isolate;}
.trybox::before{content:"";position:absolute;left:-30%;top:-70%;width:160%;height:220%;z-index:-1;background:conic-gradient(from 0deg,rgba(246,192,78,.3),rgba(200,54,74,.22),rgba(46,139,87,.22),rgba(246,192,78,.3));filter:blur(70px);opacity:.5;animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.say{display:flex;gap:10px;}
.say input{flex:1;min-width:0;font:inherit;font-size:18px;padding:15px 18px;border-radius:18px;border:1px solid rgba(255,215,170,.22);background:rgba(255,255,255,.07);color:#fff;}
.say input::placeholder{color:#BFAE9C;}
.say input:focus{outline:none;border-color:#F6C04E;box-shadow:0 0 0 4px rgba(246,192,78,.2);}
.say button{flex:none;height:56px;padding:0 22px;border-radius:18px;border:0;background:linear-gradient(135deg,#F8C85A,#E8940F);color:#2B1900;font-weight:600;}
@media (max-width:560px){.say{flex-direction:column;}.say button{width:100%;}}
.tryx{margin-top:12px;background:none;border:0;color:#D6C6B4;text-decoration:underline;text-underline-offset:3px;font-size:14.5px;padding:4px 0;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,215,170,.18);animation:pop .35s var(--ease) both;}
.chip button{background:none;border:0;padding:0;color:#C9B8A6;font-size:16px;line-height:1;}
.trystats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.tstat{flex:1 1 200px;border-radius:16px;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,170,.12);}
.tstat b{display:block;font-family:var(--head);font-size:30px;line-height:1;}
.tstat.ready b{color:#7BE0A6;}.tstat.almost b{color:#F6C04E;}
.tstat span{font-size:13.5px;color:#C9B8A6;}
.tryres{margin-top:18px;}
.tryfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:20px;font-size:13.5px;color:#C9B8A6;}
.tryfoot a{color:#F6C04E;font-weight:600;text-decoration:none;}
/* recipe cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
@media (max-width:520px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}}
.rcard{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:rgba(var(--glass),var(--ga));box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .3s var(--ease);animation:rise .7s var(--ease) both;}
.rcard:hover{transform:translateY(-4px);}
@keyframes rise{from{opacity:0;transform:translate3d(0,24px,0);}}
.plate{position:relative;aspect-ratio:1.5;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--dc) 35%,transparent),transparent 70%),color-mix(in srgb,var(--dc) 12%,var(--surf));}
.plate::before{content:"";width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--dc) 92%,#000) 0 44%,color-mix(in srgb,var(--dc) 70%,#fff) 45% 49%,#FFFDF8 50% 66%,#EFE6D8 67% 70%,transparent 71%);
  box-shadow:0 18px 30px -14px rgba(40,20,5,.55);transform:translateY(8px) rotate(-8deg);transition:transform .6s var(--ease);}
.rcard:hover .plate::before{transform:translateY(4px) rotate(8deg) scale(1.04);}
.plate .fa{position:absolute;bottom:10px;inset-inline-end:12px;font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;font-size:15px;color:color-mix(in srgb,var(--dc) 70%,var(--ink));direction:rtl;}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.rbody b{font-family:var(--head);font-weight:600;font-size:16.5px;line-height:1.25;}
.rmeta{font-family:var(--mono);font-size:11.5px;color:var(--sub);}
.badge{align-self:flex-start;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin-top:auto;}
.badge.ready{background:color-mix(in srgb,#2E8B57 22%,transparent);color:#7BE0A6;}
.badge.miss{background:color-mix(in srgb,#E89A12 20%,transparent);color:#F6C04E;}
.light .badge.ready{color:var(--herb);}.light .badge.miss{color:#9A5D00;}
/* kitchen chapter */
.shelf{border-radius:28px;padding:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,215,170,.12);}
.shelf h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#C9B8A6;margin:16px 0 10px;}
.shelf h3:first-child{margin-top:0;}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.app{border-radius:16px;padding:12px 8px;text-align:center;font-size:13.5px;border:1px solid rgba(255,215,170,.14);background:rgba(255,255,255,.04);}
.app.on{border-color:#F6C04E;background:rgba(246,192,78,.14);font-weight:600;}
.app.off{opacity:.5;text-decoration:line-through;}
.points{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;gap:14px;}
.points li{display:flex;gap:12px;align-items:flex-start;}
.points li::before{content:"";width:22px;height:22px;flex:none;border-radius:50%;margin-top:3px;background:radial-gradient(circle,#F6C04E 0 30%,rgba(246,192,78,.2) 32%);}
/* library */
.libfoot{margin-top:28px;}
/* meal timeline */
.mealcard{border-radius:28px;padding:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,215,170,.12);}
.mhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:#C9B8A6;margin-bottom:14px;}
.tl{position:relative;display:flex;flex-direction:column;}
.tl::before{content:"";position:absolute;top:8px;bottom:8px;inset-inline-start:61px;width:2px;background:rgba(255,215,170,.14);}
.tle{display:grid;grid-template-columns:50px 24px 1fr;gap:10px;padding:7px 0;align-items:start;}
.tle time{font-family:var(--mono);font-size:13px;text-align:end;padding-top:1px;}
.tle .dot{width:14px;height:14px;border-radius:50%;margin:4px auto 0;background:var(--dc);border:3px solid #0E0906;box-shadow:0 0 0 1px var(--dc);position:relative;z-index:1;}
.tle p{font-size:14.5px;}.tle p b{display:block;font-size:12px;color:#C9B8A6;font-weight:500;}
.shop{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,215,170,.12);}
.shop h3{font-size:15px;margin-bottom:10px;}
.shop .chips .chip{font-size:13px;}
/* cook along */
.along{background:radial-gradient(80% 60% at 70% 30%,rgba(200,54,74,.2),transparent 60%),#0E0906;}
.live{border-radius:30px;padding:26px;background:rgba(24,18,13,.8);border:1px solid rgba(255,215,170,.14);box-shadow:0 40px 90px -40px #000;}
.livepill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:99px;background:rgba(200,54,74,.16);color:#FF9DAA;font-family:var(--mono);font-size:11px;letter-spacing:.16em;}
.livepill i{width:7px;height:7px;border-radius:50%;background:#FF4D6A;box-shadow:0 0 10px #FF4D6A;animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.3;}}
.timer{font-family:var(--head);font-weight:700;font-size:clamp(64px,11vw,110px);letter-spacing:-.05em;line-height:.95;margin:16px 0 4px;background:linear-gradient(180deg,#fff 30%,#FFD98A);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;text-align:start;}
html[dir="rtl"] .timer{text-align:right;}
.timerlbl{color:#C9B8A6;font-size:14px;}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px;}.bar i{display:block;height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,#E8940F,#F6C04E);}
.now{margin-top:18px;padding:16px;border-radius:18px;border:1px solid rgba(246,192,78,.4);background:rgba(246,192,78,.08);}
.now b,.next b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#F6C04E;margin-bottom:6px;}
.next{margin-top:10px;padding:12px 16px;border-radius:16px;border:1px solid rgba(255,215,170,.14);color:#C9B8A6;font-size:15px;}
.next b{color:#C9B8A6;}
/* cooks + ai */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px;}
@media (max-width:880px){.two{grid-template-columns:1fr;}}
.panel{border-radius:28px;padding:26px;border:1px solid var(--line);background:rgba(var(--glass),var(--ga));box-shadow:var(--shadow);}
.panel h3{font-size:clamp(24px,2.8vw,32px);margin-bottom:12px;}
.panel p{color:var(--sub);}
.excard{margin-top:22px;max-width:260px;position:relative;}
.extag{position:absolute;top:10px;inset-inline-start:10px;z-index:2;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--sub);}
.chat{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:92%;border-radius:20px;padding:11px 15px;font-size:15px;line-height:1.55;}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#F8C85A,#E8940F);color:#2B1900;border-end-end-radius:6px;}
.msg.bot{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-end-start-radius:6px;}
.msg ol{margin:6px 0 0;padding-inline-start:20px;}.msg li{margin:3px 0;}
.rchip{display:inline-block;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:rgba(246,192,78,.15);border-radius:999px;padding:0 9px;font-weight:600;font-size:.93em;text-decoration:none;color:inherit;}
/* food log */
.logdemo{border-radius:28px;padding:22px;background:#140E0A;color:#F5EEE5;border:1px solid rgba(255,215,170,.12);}
.logq{font-size:17px;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,215,170,.22);background:rgba(255,255,255,.06);min-height:52px;}
.logq .caret{display:inline-block;width:2px;height:1.1em;background:#F6C04E;vertical-align:-3px;margin-inline-start:2px;animation:pulse 1s steps(1) infinite;}

@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none;}*{animation-duration:.001s!important;animation-iteration-count:1!important;}}

<script>
(function(){
'use strict';
/* ===================== landing page ===================== */
var $=function(id){return document.getElementById(id);};
var calm=matchMedia('(prefers-reduced-motion:reduce)').matches,finePtr=matchMedia('(hover:hover) and (pointer:fine)').matches;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
var LANGS=window.DP_LANGS,LCODES=LANGS.map(function(x){return x[0];});
var LANG=LCODES.indexOf(document.documentElement.lang)>=0?document.documentElement.lang:'en';
if(LANG!=='en'&&LANG!=='fa'&&!(window.DP_LANG&&DP_LANG[LANG]))LANG='en';
function linfo(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]===c)return LANGS[i];return LANGS[0];}
function lx(){return LANG!=='en'&&LANG!=='fa'&&window.DP_LANG?DP_LANG[LANG]:null;}
function t(k,v){var s=null,e=DP_T[k];if(LANG==='fa'){if(e)s=e[1];}else if(LANG!=='en'){var L=lx();if(L&&L.ui&&L.ui[k]!=null)s=L.ui[k];}
  if(s==null)s=e?e[0]:k;if(v)s=s.replace(/\{(\w+)\}/g,function(m,n){return v[n]!=null?v[n]:'';});return s;}
var DIG={fa:'۰۱۲۳۴۵۶۷۸۹',ar:'٠١٢٣٤٥٦٧٨٩'};
function loc(s){var d=DIG[LANG];s=String(s);if(!d)return s;return s.replace(/\d/g,function(x){return d[x];}).replace(/,/g,'٬').replace(/\./g,'٫');}
function N(n){n=Math.round(Number(n)||0);if(DIG[LANG]||LANG==='en')return loc(n.toLocaleString('en-US'));try{return n.toLocaleString(linfo(LANG)[3]);}catch(e){return String(n);}}
function hhmm(ts){try{return new Date(ts).toLocaleTimeString(linfo(LANG)[3],{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function minsTxt(m){m=Math.round(m);if(m<60)return N(m)+' '+t('min');var h=Math.floor(m/60),r=m%60;return N(h)+' '+t('h')+(r?' '+N(r)+' '+t('min'):'');}
function trRec(r){var L=lx();return L&&L.rec?L.rec[r.id]:null;}
function rTitle(r){if(LANG==='fa')return r.t[1];var x=trRec(r);return (x&&x[0])||r.t[0];}
function rStep(r,i){var s=r.s[i];if(LANG==='fa')return s[2];var x=trRec(r);return (x&&x[2]&&x[2][i])||s[1];}
function itemName(k){var o=Kitchen.ING[k];return o?(o[LANG]||o.en):k;}
function appName(k){var o=Kitchen.APP[k];return o?(o[LANG]||o.en):k;}
var DCOL={'ghormeh-sabzi':'#4B5A22',gheymeh:'#A8461F',fesenjan:'#5A2F1D','khoresh-bademjan':'#9A3D25','khoresh-karafs':'#5E7A2E',abgoosht:'#9B5A2A',chelo:'#E9B940',kateh:'#E3CC8A',
  'zereshk-polo':'#C8364A','loobia-polo':'#B5502A','adas-polo':'#8A5A2B','baghali-polo':'#6E9A3A','sabzi-polo':'#4E8A3A',tahchin:'#E3A017',estamboli:'#C4542A','joojeh-kabab':'#E8940F',
  koobideh:'#8C3B1E','kabab-tabei':'#9A4422','ash-reshteh':'#5C6E2E',adasi:'#B07A33','soup-jo':'#D2A24C',nimroo:'#F2C35A','noon-panir-sabzi':'#7FA35A',halim:'#A9824F',kotlet:'#7A3E1C',
  'kuku-sabzi':'#3E6B25','kuku-sibzamini':'#D9A441','mirza-ghasemi':'#B8732E','kashk-bademjan':'#8E6A3E',omlet:'#D2502E',makaroni:'#C0582A',yatimcheh:'#A64A26','salad-shirazi':'#5FA044',
  'mast-o-khiar':'#8FB57C','borani-esfenaj':'#6F9A48',olivieh:'#D9BE72','sabzi-khordan':'#4F8F3A','sholeh-zard':'#F2B01E','shir-berenj':'#E5D6BE',halva:'#8A4E1F',fereni:'#E7D9BF',
  'cake-yazdi':'#D99A3A',doogh:'#B9D1BD',sekanjabin:'#8FBF6A',chai:'#9A3B1A',shakshuka:'#C8432A','egg-fried-rice':'#D9B24A','chicken-curry':'#D08A2A','pasta-pomodoro':'#C8432A',
  'roast-chicken':'#C07A2E',pancakes:'#D9A44A','boiled-eggs':'#E8C15A','scrambled-eggs':'#F0C040','folded-omelette':'#E9B23C','poached-eggs':'#EDCB6A',
  tamagoyaki:'#E8B830','steamed-egg':'#E9CF7A',meringues:'#E0CFB0',khagineh:'#D98E1F',eshkeneh:'#C9922E',nargesi:'#4E7A2E','potato-eggs':'#D7A13C',
  'spanish-tortilla':'#D9A441','french-toast':'#C98A3A','egg-sandwich':'#E4C46A','egg-in-a-hole':'#D9A44A','deviled-eggs':'#E8C65A','egg-custard':'#E6C57A',
  'banana-pancakes':'#D9B04A','egg-curry':'#C9702A','baked-potatoes':'#B98A4A','mashed-potatoes':'#E0CB94','fried-potatoes':'#E0A83A','grilled-cheese':'#E0A030',
  'tomato-soup':'#C8432A','garlic-bread':'#C8964A','aglio-olio':'#D8B85A','shir-moz':'#E6D39A','tuna-sandwich':'#B9A06A'};
var CCOL={stew:'#6A4A22',rice:'#E3A017',kebab:'#B5522A',soup:'#8A7A2E',main:'#B0602A',side:'#5FA044',salad:'#5FA044',breakfast:'#E0A030',dessert:'#E6B84A',drink:'#8FB896',bread:'#C8964A',snack:'#C8964A'};
function dcol(r){return DCOL[r.id]||CCOL[r.c]||'#B0602A';}

/* ---------- language menu ---------- */
function applyLang(){var h=document.documentElement;h.lang=LANG;h.dir=linfo(LANG)[2];
  [].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=t(e.getAttribute('data-t'));});
  [].forEach.call(document.querySelectorAll('[data-tp]'),function(e){e.placeholder=t(e.getAttribute('data-tp'));});
  [].forEach.call(document.querySelectorAll('[data-ta]'),function(e){e.setAttribute('aria-label',t(e.getAttribute('data-ta')));});
  $('langcode').textContent=LANG.toUpperCase();$('langbtn').setAttribute('aria-label',t('language')+': '+linfo(LANG)[1]);
  document.title=t('L_title');var md=document.querySelector('meta[name="description"]');if(md)md.content=t('L_desc');buildLangMenu();}
function langPrep(c){var L=(c!=='en'&&c!=='fa'&&window.DP_LANG)?DP_LANG[c]:null;Kitchen.useLang(c,L);MacroFoods.useLang(c,L);}
function buildLangMenu(){var m=$('langmenu');m.textContent='';LANGS.forEach(function(x){var b=el('button','langopt');b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(x[0]===LANG));
  var n=el('span',null,x[1]);n.lang=x[0];n.dir=x[2];b.appendChild(n);b.appendChild(el('small',null,x[0].toUpperCase()));b.onclick=function(){closeMenu();setLang(x[0]);};m.appendChild(b);});}
function closeMenu(){$('langmenu').hidden=true;$('langbtn').setAttribute('aria-expanded','false');}
$('langbtn').onclick=function(e){e.stopPropagation();var m=$('langmenu');m.hidden=!m.hidden;$('langbtn').setAttribute('aria-expanded',String(!m.hidden));if(!m.hidden){var c=m.querySelector('[aria-checked="true"]');if(c)c.focus();}};
document.addEventListener('click',function(e){if(!$('langmenu').hidden&&!$('langwrap').contains(e.target))closeMenu();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('langmenu').hidden){closeMenu();$('langbtn').focus();}});
var loading={};
function loadLang(c){if(c==='en'||c==='fa'||(window.DP_LANG&&DP_LANG[c]))return Promise.resolve(true);if(loading[c])return loading[c];
  loading[c]=new Promise(function(res){var s=document.createElement('script');s.src='lang-'+c+'.js?v='+window.DP_V;s.onload=function(){res(!!(window.DP_LANG&&DP_LANG[c]));};s.onerror=function(){delete loading[c];res(false);};document.head.appendChild(s);});return loading[c];}
async function setLang(c){if(c===LANG)return;$('langbtn').classList.add('busy');var ok=await loadLang(c);$('langbtn').classList.remove('busy');if(!ok)return;
  LANG=c;try{localStorage.setItem('dp.lang',c);}catch(e){}langPrep(c);applyLang();renderAll();placeRing();}

/* ---------- recipe cards ---------- */
function card(m,i){var r=m.r||m,a=el('a','rcard');a.href='app.html#r/'+r.id;a.style.setProperty('--dc',dcol(r));a.style.animationDelay=Math.min(i||0,10)*.04+'s';
  var pl=el('div','plate');if(LANG!=='fa'){var f=el('span','fa',r.t[1]);pl.appendChild(f);}a.appendChild(pl);
  var b=el('div','rbody');b.appendChild(el('b',null,rTitle(r)));b.appendChild(el('span','rmeta',minsTxt(r.min)+' · '+t('serves',{n:N(r.sv)})));
  if(m.r){if(m.ready)b.appendChild(el('span','badge ready','✓ '+t('L_haveAll')));
    else b.appendChild(el('span','badge miss',t('L_missing',{list:m.missing.slice(0,2).map(function(x){return Kitchen.ingName(x.keys.slice(0,1),LANG);}).join(t('comma'))})));}
  a.appendChild(b);return a;}

/* ---------- try it ---------- */
var tryKeys=[];try{tryKeys=JSON.parse(localStorage.getItem('dp.try'))||[];}catch(e){}
var TRYAPPS=['stove','oven','rice cooker','pressure cooker','blender'];
function saveTry(){try{localStorage.setItem('dp.try',JSON.stringify(tryKeys));}catch(e){}}
function addTry(text){var p=Kitchen.parse(text);p.keys.concat(p.custom).forEach(function(k){if(tryKeys.indexOf(k)<0)tryKeys.push(k);});saveTry();renderTry(true);}
function renderTry(scroll){
  var ch=$('trychips');ch.textContent='';
  tryKeys.forEach(function(k){var c=el('span','chip',itemName(k)),x=el('button',null,'×');x.type='button';x.setAttribute('aria-label',t('removeX',{x:itemName(k)}));
    x.onclick=function(){tryKeys=tryKeys.filter(function(y){return y!==k;});saveTry();renderTry();};c.appendChild(x);ch.appendChild(c);});
  var res=$('tryres');res.textContent='';$('trystats').hidden=!tryKeys.length;if(!tryKeys.length)return;
  var ranked=Kitchen.rank(DP_RECIPES,{ingredients:tryKeys,appliances:TRYAPPS,staples:true}),ready=ranked.filter(function(m){return m.ready;}),almost=ranked.filter(function(m){return !m.ready&&m.appsOk&&m.missing.length<=2;});
  $('tsr').textContent=N(ready.length);$('tsrl').textContent=t('L_tryReady',{n:''}).trim();$('tsa').textContent=N(almost.length);$('tsal').textContent=t('L_tryAlmost',{n:''}).trim();
  var list=ready.concat(almost).slice(0,8);
  if(!list.length){res.appendChild(el('p',null,t('L_tryNone')));return;}
  var g=el('div','rgrid');list.forEach(function(m,i){g.appendChild(card(m,i));});res.appendChild(g);
}
$('tryform').onsubmit=function(e){e.preventDefault();var v=$('tryin').value.trim();if(!v)return;$('tryin').value='';addTry(v);};
$('tryex').onclick=function(){tryKeys=[];addTry(t('L_tryPh'));};

/* ---------- chapters ---------- */
function renderShelf(){var s=$('shelf');s.textContent='';
  var groups=[['protein',['chicken','lamb','eggs']],['herb',['parsley','coriander','dill','mint']],['grain',['rice','bread']],['spice',['saffron','turmeric','cinnamon']]];

/* ===================== the ring: hand-built 3D renderer behind sign-in, setup and live cooking ===================== */
var Ring=(function(){
  var cv=$('stage3d'), ctx=cv.getContext('2d');
  var bl=document.createElement('canvas'), blx=bl.getContext('2d');
  var W=0,H=0,dpr=1,mobile=innerWidth<760,NU=mobile?52:84,NV=mobile?9:13,running=false,raf=0;
  var canFilter=(function(){try{blx.filter='blur(2px)';return !!blx.filter&&blx.filter!=='none';}catch(e){return false;}})();
  var st={prog:.32,split:0,D:3.1,a:.62,x:0,y:0,breathe:0,spin:1};
  var seg=[{end:.25,col:[66,115,248]},{end:.66,col:[74,190,120]},{end:1,col:[228,65,109]}],SEGC=seg.map(function(q){return q.col;});
  var MINT=[246,178,62],STEEL=[52,40,31];
  function nrm(v){var m=Math.hypot(v[0],v[1],v[2]);return [v[0]/m,v[1]/m,v[2]/m];}
  var L1=nrm([-.42,.78,.86]),L2=nrm([.82,-.28,-.42]),HV=nrm([L1[0],L1[1],L1[2]+1]);
  var tw=[],px=0,py=0,tpx=0,tpy=0,parts=[];
  for(var i=0;i<(mobile?60:130);i++){var th=Math.random()*6.2832,ph=Math.acos(2*Math.random()-1),rr=2+Math.random()*4.2;
    parts.push({x:rr*Math.sin(ph)*Math.cos(th),y:rr*Math.cos(ph),z:rr*Math.sin(ph)*Math.sin(th),s:.5+Math.random()*1.5,h:Math.random()});}
  if(finePtr&&!calm)addEventListener('pointermove',function(e){tpx=e.clientX/innerWidth-.5;tpy=e.clientY/innerHeight-.5;},{passive:true});
  function size(){dpr=Math.min(devicePixelRatio||1,mobile?1.5:2);W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);bl.width=Math.max(1,Math.round(W*dpr/7));bl.height=Math.max(1,Math.round(H*dpr/7));}
  addEventListener('resize',function(){mobile=innerWidth<760;size();if(!running)draw(performance.now());});
  size();
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function to(target,ms){
    if(calm||!ms){for(var k in target)st[k]=target[k];if(!running)draw(performance.now());return;}
    var from={},t2={};for(var k2 in target){from[k2]=st[k2];t2[k2]=target[k2];}
    tw.forEach(function(t){for(var k in t2){delete t.target[k];}});
    tw=tw.filter(function(t){return Object.keys(t.target).length;});
    tw.push({from:from,target:t2,t0:performance.now(),ms:ms});
  }
  function setShares(p,c,f){var tot=p*4+c*4+f*9;if(!tot)return;var a=p*4/tot,b=a+c*4/tot;seg[0].end=a;seg[1].end=b;seg[2].end=1;}
  function step(t){tw=tw.filter(function(w){var k=Math.min(1,(t-w.t0)/w.ms),e=ease(k);for(var key in w.target)st[key]=w.from[key]+(w.target[key]-w.from[key])*e;return k<1;});}
  function draw(time){
    var sx=mobile?0:st.x, sy=mobile?st.y-.26:st.y, DD=mobile?st.D*1.18:st.D, alpha=clamp(st.a,0,1);
    var cx=W*(.5+sx), cy=H*(.5+sy), f=Math.min(W,H)*(mobile?.86:.9);
    px+=(tpx-px)*.06; py+=(tpy-py)*.06;
    var prog=clamp(st.prog+(st.breathe?Math.sin(time*.0026)*.07*st.breathe:0),0,1);
    var rx=.5+py*.3, ry=time*.00016*st.spin+px*.42, rz=-.14;
    var cxr=Math.cos(rx),sxr=Math.sin(rx),cyr=Math.cos(ry),syr=Math.sin(ry),czr=Math.cos(rz),szr=Math.sin(rz);
    function tr(x,y,z){var y1=y*cxr-z*sxr,z1=y*sxr+z*cxr,x2=x*cyr+z1*syr,z2=-x*syr+z1*cyr;return [x2*czr-y1*szr,x2*szr+y1*czr,z2];}
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.globalAlpha=1;
    var g0=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.65);
    g0.addColorStop(0,'rgba(246,176,62,'+(.14*alpha).toFixed(3)+')');g0.addColorStop(.55,'rgba(120,36,28,'+(.07*alpha).toFixed(3)+')');g0.addColorStop(1,'rgba(12,9,6,0)');
    ctx.fillStyle=g0;ctx.fillRect(0,0,W,H);
    var bx=cx+Math.sin(time*.00021)*W*.2,by=cy+Math.cos(time*.00017)*H*.22,g1=ctx.createRadialGradient(bx,by,0,bx,by,Math.min(W,H)*.46);
    g1.addColorStop(0,'rgba(200,54,74,'+(.12*alpha).toFixed(3)+')');g1.addColorStop(1,'rgba(200,54,74,0)');ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
    var R=1,r=.3,du=6.28318/NU,dv=6.28318/NV,i,j,buf=[];
    var cu=[],su=[],cvv=[],svv=[],cuh=[],suh=[],cvh=[],svh=[];
    for(i=0;i<=NU;i++){cu[i]=Math.cos(i*du);su[i]=Math.sin(i*du);cuh[i]=Math.cos((i+.5)*du);suh[i]=Math.sin((i+.5)*du);}
    for(j=0;j<=NV;j++){cvv[j]=Math.cos(j*dv);svv[j]=Math.sin(j*dv);cvh[j]=Math.cos((j+.5)*dv);svh[j]=Math.sin((j+.5)*dv);}
    var vert=[];
    for(i=0;i<=NU;i++){var row=[];for(j=0;j<=NV;j++){var rad=R+r*cvv[j],p=tr(rad*cu[i],rad*su[i],r*svv[j]),pz=DD-p[2];if(pz<.25)pz=.25;var s=f/pz;row.push([cx+p[0]*s,cy-p[1]*s,pz]);}vert.push(row);}
    for(i=0;i<NU;i++){
      var frac=i/NU, lit=frac<=prog, base;
      if(!lit)base=STEEL;
      else if(st.split<=.001)base=MINT;
      else{var sc=seg[0].col;for(var q=0;q<seg.length;q++){if(frac<=seg[q].end){sc=seg[q].col;break;}}
        base=[lerp(MINT[0],sc[0],st.split),lerp(MINT[1],sc[1],st.split),lerp(MINT[2],sc[2],st.split)];}
      for(j=0;j<NV;j++){
        var n=tr(cvh[j]*cuh[i],cvh[j]*suh[i],svh[j]); if(n[2]<=.02)continue;
        var d1=Math.max(0,n[0]*L1[0]+n[1]*L1[1]+n[2]*L1[2]),d2=Math.max(0,n[0]*L2[0]+n[1]*L2[1]+n[2]*L2[2]),hs=Math.max(0,n[0]*HV[0]+n[1]*HV[1]+n[2]*HV[2]);
        var spec=Math.pow(hs,42)*(lit?235:120),k=.15+d1*.95+d2*.3;
        var A=vert[i][j],B=vert[i+1][j],C=vert[i+1][j+1],E=vert[i][j+1];
        buf.push({t:0,a:A,b:B,c:C,d:E,z:(A[2]+C[2])*.5,col:'rgb('+(clamp(base[0]*k+spec,0,255)|0)+','+(clamp(base[1]*k+spec*1.02,0,255)|0)+','+(clamp(base[2]*k+spec*.96,0,255)|0)+')'});
      }
    }
    for(var pi=0;pi<parts.length;pi++){var pt=parts[pi],p3=tr(pt.x,pt.y,pt.z),pz3=DD-p3[2];if(pz3<.3)continue;var s3=f/pz3;
      buf.push({t:2,x:cx+p3[0]*s3,y:cy-p3[1]*s3,rad:Math.max(.35,pt.s*s3*.0022),z:pz3,h:pt.h});}
    buf.sort(function(a,b){return b.z-a.z;});
    ctx.globalAlpha=alpha;
    for(var m=0;m<buf.length;m++){var o=buf[m];
      if(o.t===0){ctx.beginPath();ctx.moveTo(o.a[0],o.a[1]);ctx.lineTo(o.b[0],o.b[1]);ctx.lineTo(o.c[0],o.c[1]);ctx.lineTo(o.d[0],o.d[1]);ctx.closePath();
        ctx.fillStyle=o.col;ctx.fill();ctx.strokeStyle=o.col;ctx.lineWidth=1.05;ctx.stroke();}
      else{ctx.fillStyle=o.h>.72?'rgba(246,192,78,.55)':(o.h>.45?'rgba(255,160,140,.36)':'rgba(245,232,215,.26)');ctx.beginPath();ctx.arc(o.x,o.y,o.rad,0,6.2832);ctx.fill();}}
    ctx.globalAlpha=1;
    if(bl.width>2){blx.setTransform(1,0,0,1,0,0);blx.clearRect(0,0,bl.width,bl.height);blx.drawImage(cv,0,0,bl.width,bl.height);
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5*alpha;if(canFilter)ctx.filter='blur(5px)';ctx.drawImage(bl,0,0,W,H);ctx.restore();}
  }
  function loop(t){step(t);draw(t);if(running)raf=requestAnimationFrame(loop);}
  return {st:st,to:to,setShares:setShares,palette:function(c){for(var i=0;i<3;i++)seg[i].col=(c&&c[i])||SEGC[i];},
    start:function(){if(running)return;if(calm){draw(performance.now());return;}running=true;raf=requestAnimationFrame(loop);},
    stop:function(){running=false;cancelAnimationFrame(raf);}};
})();

  wait:{prog:.46,split:0,D:2.95,a:.82,breathe:1,spin:2.2},
  done:{prog:1,split:0,D:2.55,a:1,breathe:0,spin:1.5},
