<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg;}
:root{color-scheme:light dark;
  --bg:#FBF6EC;--bg2:#F4ECDD;--surf:#FFFFFF;--ink:#1F1712;--sub:#6F6459;--line:rgba(70,45,20,.14);--glass:255,252,246;--ga:.82;
  --accent:#B86E00;--shadow:0 1px 2px rgba(60,35,10,.06),0 18px 44px -22px rgba(60,35,10,.32);
  --saff:#E89A12;--saff2:#F6C04E;--pom:#C8364A;--herb:#2E8B57;--night:#0B0705;--night2:#140D09;--cream:#F5EEE5;--creamsub:#CDBBA8;
  --gold:linear-gradient(135deg,#FAD27A,#E8940F);
  --head:'Familjen Grotesk','Trebuchet MS',system-ui,sans-serif;--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.26,1);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100B08;--bg2:#17100C;--surf:#1C140F;--ink:#F4EDE4;--sub:#A99B8D;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.74;--accent:#F2B340;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--bg:#100B08;--bg2:#17100C;--surf:#1C140F;--ink:#F4EDE4;--sub:#A99B8D;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.74;--accent:#F2B340;--shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}
html[lang="fa"],html[lang="ar"]{--head:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--body:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--mono:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;}
html[lang="ru"]{--head:'Manrope','Segoe UI',system-ui,sans-serif;--body:'Manrope','Segoe UI',system-ui,sans-serif;}
html[dir="rtl"] body *{letter-spacing:0!important;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:90px;}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased;}
html[dir="rtl"] body{line-height:1.85;}
[hidden]{display:none!important;}
a{color:inherit;}button{font:inherit;color:inherit;cursor:pointer;}
img{display:block;max-width:100%;}
:focus-visible{outline:2px solid var(--saff2);outline-offset:3px;border-radius:8px;}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--surf);color:var(--ink);padding:10px 14px;border-radius:10px;}
.skip:focus{top:12px;}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.035em;line-height:1.04;text-wrap:balance;}
html[dir="rtl"] h1,html[dir="rtl"] h2{line-height:1.32;}
p{margin:0;}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:10px;margin:0 0 18px;}
html[dir="rtl"] .eyebrow{font-size:14px;}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--saff2);box-shadow:0 0 14px 2px rgba(246,192,78,.75);flex:none;}
.lead{font-size:clamp(17px,1.8vw,20px);color:var(--sub);max-width:58ch;margin-top:18px;}
.d2{font-size:clamp(34px,5vw,62px);}
section{position:relative;}
.pad{padding:clamp(80px,11vw,140px) 0;}
.dark{background:transparent;color:var(--cream);--ink:#F5EEE5;--sub:#C9B8A6;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.6;--surf:#1C140F;--accent:#F6C04E;}
.light{background:transparent;color:var(--cream);--ink:#F5EEE5;--sub:#C9B8A6;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.55;--surf:#1C140F;--accent:#F6C04E;--bg:#0E0906;--bg2:#140D09;--herb:#7BE0A6;--shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}
.center{text-align:center;}.center .lead{margin-inline:auto;}.center .eyebrow{justify-content:center;}

/* ---------- floating header with sign in / sign up ---------- */
.nav{position:fixed;top:10px;left:10px;right:10px;z-index:60;max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 14px;
  padding-top:calc(7px + env(safe-area-inset-top,0px)*.3);border-radius:999px;background:rgba(18,12,8,.8);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  border:1px solid rgba(255,215,170,.14);color:var(--cream);box-shadow:0 20px 50px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .45s var(--ease),background .3s;}
html[dir="rtl"] .nav{padding:7px 14px 7px 7px;}
.nav.hide{transform:translateY(-130%);}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:18.5px;text-decoration:none;letter-spacing:-.02em;margin-inline-end:auto;white-space:nowrap;}
.brand svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 10px rgba(246,192,78,.35));}
.navlinks{display:flex;gap:2px;margin-inline-end:6px;}
.navlinks a{padding:8px 12px;border-radius:999px;text-decoration:none;font-size:14.5px;color:var(--creamsub);transition:color .2s,background .2s;}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.07);}
@media (max-width:940px){.navlinks{display:none;}}
.langwrap{position:relative;}
.langbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,215,170,.2);background:rgba(255,255,255,.05);font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.06em;color:var(--cream);}
.langbtn svg{width:16px;height:16px;}
.langbtn.busy{opacity:.55;pointer-events:none;}
.langmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;z-index:70;min-width:210px;padding:6px;border-radius:18px;background:#1C140F;color:var(--cream);border:1px solid rgba(255,215,170,.16);box-shadow:0 24px 60px -20px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:2px;animation:pop .22s var(--ease) both;}
.langopt{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:9px 12px;text-align:start;font-size:15px;}
.langopt span{flex:1;}.langopt:hover,.langopt:focus-visible{background:rgba(246,192,78,.16);outline:none;}
.langopt[aria-checked="true"]{font-weight:600;}.langopt[aria-checked="true"]::after{content:"✓";color:var(--saff2);}
.langopt small{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--creamsub);}
.langopt span[lang="fa"],.langopt span[lang="ar"]{font-family:'Vazirmatn',Tahoma,sans-serif;}.langopt span[lang="ru"]{font-family:'Manrope',system-ui,sans-serif;}
.nbtn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 15px;border-radius:999px;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:transform .2s var(--ease),background .2s,box-shadow .2s;}
.nbtn.in{border:1px solid rgba(255,215,170,.24);color:var(--cream);}
.nbtn.in:hover{background:rgba(255,255,255,.08);}
.nbtn.up{position:relative;overflow:hidden;background:var(--gold);color:#2B1900;box-shadow:0 8px 24px -8px rgba(232,148,15,.9);}
.nbtn.up:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(232,148,15,1);}
.nbtn.up::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite 1.5s;}
@keyframes shine{0%,70%{left:-60%;}100%{left:130%;}}
@media (max-width:460px){.brand span{display:none;}.nbtn{padding:0 12px;font-size:13.5px;}.langbtn{padding:0 9px;}.nav{gap:6px;}}
@media (max-width:400px){.langbtn span{display:none;}.langbtn{width:38px;padding:0;justify-content:center;}.nbtn{padding:0 10px;font-size:13px;}.nav{left:8px;right:8px;gap:5px;}}
@keyframes pop{from{opacity:0;transform:scale(.94);}}

/* ---------- buttons ---------- */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;border:0;background:var(--gold);color:#2B1900;font-weight:600;font-size:16.5px;text-decoration:none;white-space:nowrap;
  box-shadow:0 14px 38px -12px rgba(232,148,15,.85);transition:transform .25s var(--ease),box-shadow .25s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 48px -14px rgba(232,148,15,.95);}
.cta svg{width:16px;height:16px;}html[dir="rtl"] .cta svg{transform:scaleX(-1);}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 24px;border-radius:999px;border:1px solid var(--line);color:inherit;text-decoration:none;font-weight:500;background:none;transition:border-color .2s,transform .2s;}
.ghost:hover{border-color:currentColor;transform:translateY(-1px);}

/* ---------- hero ---------- */
.hero{position:relative;color:var(--cream);overflow:clip;isolation:isolate;background:transparent;}
.hero .pin{position:relative;min-height:100vh;min-height:100svh;padding:112px 0 48px;display:flex;align-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(900px 620px at 78% 30%,rgba(200,54,74,.30),transparent 62%),radial-gradient(760px 560px at 8% 90%,rgba(46,139,87,.22),transparent 62%),radial-gradient(900px 520px at 55% 115%,rgba(232,154,18,.34),transparent 62%);}
.hero .pin>.wrap{width:100%;}
#dust{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;}
.floor{position:absolute;left:-40%;right:-40%;bottom:-6%;height:52%;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,205,150,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,205,150,.10) 1px,transparent 1px);background-size:70px 70px;
  transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 78%);mask-image:linear-gradient(to top,#000 5%,transparent 78%);animation:floor 5s linear infinite;}
@keyframes floor{to{background-position:0 70px;}}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:clamp(20px,4vw,56px);align-items:center;}
@media (max-width:1000px){.hgrid{grid-template-columns:1fr;}}
.hcopy{position:relative;z-index:2;}
.hero .eyebrow{color:#E9D6BF;}
.hero .eyebrow{margin-bottom:16px;}
@media (max-width:520px){.hero .eyebrow{letter-spacing:.1em;font-size:10.5px;}}
.hero .eyebrow .chipline{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,170,.18);}
.mega{font-size:clamp(38px,4.7vw,70px);line-height:1;letter-spacing:-.045em;}
html[dir="rtl"] .mega{line-height:1.25;}
.mega .w{display:inline-block;transform-origin:50% 100%;animation:wordIn 1.1s var(--ease) both;animation-delay:calc(var(--i) * 65ms + .1s);}
.mega .w.hl{background:linear-gradient(100deg,#FFE7AE,#F6C04E 35%,#F0864A 70%,#E0556A);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em;}
@keyframes wordIn{from{opacity:0;transform:perspective(700px) rotateX(-85deg) translateY(.4em);filter:blur(10px);}}
.hero .lead{color:#DCCBB8;max-width:52ch;font-size:clamp(16.5px,1.5vw,19px);margin-top:16px;animation:fadeUp 1s var(--ease) .55s both;}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,22px,0);}}
.hero .auth,.hero .tryline{animation:fadeUp 1s var(--ease) .75s both;}
.tryline{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:#E9D6BF;font-size:14.5px;text-decoration:none;border-bottom:1px dashed rgba(255,215,170,.35);padding-bottom:2px;}
.tryline:hover{color:#fff;border-color:#fff;}
.tryline svg{width:14px;height:14px;}

/* ---------- the sign up / sign in card ---------- */
.auth{position:relative;margin-top:22px;max-width:500px;border-radius:26px;padding:18px;color:var(--cream);
  background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 60%);border:1px solid rgba(255,215,170,.16);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 40px 90px -34px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.14);transform-style:preserve-3d;transition:transform .5s var(--ease);}
.auth::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 55%,#F6C04E 70%,#E0556A 82%,#2E8B57 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 7s linear infinite;}
@keyframes ang{to{--ang:360deg;}}
.atabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(0,0,0,.32);border:1px solid rgba(255,215,170,.1);}
.atabs button{position:relative;z-index:1;height:38px;border:0;background:none;border-radius:999px;font-weight:600;font-size:14.5px;color:#D6C4B0;transition:color .3s;}
.atabs button[aria-pressed="true"]{color:#2B1900;}
.atabs .knob{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;border-radius:999px;background:var(--gold);box-shadow:0 6px 18px -6px rgba(232,148,15,.9);transition:transform .45s var(--ease);}
.atabs[data-m="in"] .knob{transform:translateX(100%);}
html[dir="rtl"] .atabs[data-m="in"] .knob{transform:translateX(-100%);}
.auth h2{font-size:clamp(20px,2.2vw,24px);margin:16px 4px 12px;letter-spacing:-.02em;}
.aform{display:flex;gap:8px;}
.aform input{flex:1;min-width:0;height:52px;font:inherit;font-size:16.5px;padding:0 16px;border-radius:16px;border:1px solid rgba(255,215,170,.22);background:rgba(0,0,0,.28);color:#fff;transition:border-color .2s,box-shadow .2s;}
.aform input::placeholder{color:#A8978A;}
.aform input:focus{outline:none;border-color:#F6C04E;box-shadow:0 0 0 4px rgba(246,192,78,.2);}
.aform button{flex:none;height:52px;padding:0 20px;border-radius:16px;border:0;background:var(--gold);color:#2B1900;font-weight:700;font-size:15.5px;box-shadow:0 10px 26px -10px rgba(232,148,15,.95);transition:transform .2s var(--ease);}
.aform button:hover{transform:translateY(-1px);}
@media (max-width:520px){.aform{flex-direction:column;}.aform input{flex:none;width:100%;}.aform button{width:100%;}}
.aor{display:flex;align-items:center;gap:12px;margin:12px 0;color:#A8978A;font-size:13px;}
.aor::before,.aor::after{content:"";flex:1;height:1px;background:rgba(255,215,170,.14);}
.agoogle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:16px;border:1px solid rgba(255,215,170,.2);background:rgba(255,255,255,.06);font-weight:600;font-size:15px;text-decoration:none;color:#fff;transition:background .2s;}
.agoogle:hover{background:rgba(255,255,255,.12);}
.agoogle svg{width:18px;height:18px;}
.afine{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:13px;color:#BFAE9C;}
.afine svg{width:15px;height:15px;flex:none;color:#7BE0A6;}
.amsg{margin:8px 4px 0;font-size:13.5px;color:#FF9D8C;}
.auth.shake{animation:shake .45s;}
@keyframes shake{20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.auth .signed{display:flex;flex-direction:column;gap:10px;padding:6px 4px;}
.auth .signed p{color:#D6C4B0;}

/* ---------- 3D orbit of dish photos ---------- */
.stage{position:relative;height:clamp(360px,44vw,560px);perspective:1100px;perspective-origin:50% 30%;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;animation:fadeIn 1.4s var(--ease) .3s both;}
@keyframes fadeIn{from{opacity:0;}}
.stage.drag{cursor:grabbing;}
.halo{position:absolute;left:50%;top:50%;width:min(78%,440px);aspect-ratio:1;transform:translate(-50%,-50%) rotateX(72deg);border-radius:50%;pointer-events:none;
  background:conic-gradient(from var(--ang),rgba(246,192,78,.0),rgba(246,192,78,.55),rgba(224,85,106,.5),rgba(46,139,87,.45),rgba(246,192,78,.0));filter:blur(18px);opacity:.75;animation:ang 12s linear infinite;}
.halo::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--night);filter:blur(12px);}
.pedestal{position:absolute;left:50%;top:76%;width:min(92%,560px);height:90px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(246,192,78,.28),rgba(232,148,15,.08) 60%,transparent);filter:blur(4px);}
.ring{position:absolute;left:50%;top:47%;width:0;height:0;transform-style:preserve-3d;}
.ccard{--cw:158px;position:absolute;left:calc(var(--cw) / -2);top:calc(var(--cw) * -.66);width:var(--cw);height:calc(var(--cw) * 1.32);border-radius:22px;overflow:hidden;background:#24180F;color:#fff;text-decoration:none;
  box-shadow:0 30px 50px -22px rgba(0,0,0,.9),0 0 0 1px rgba(255,215,170,.14);will-change:transform,opacity;-webkit-user-drag:none;}
.ccard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
.ccard::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(8,4,2,.82));}
.ccard::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);opacity:var(--gl,0);mix-blend-mode:screen;}
.ccard .cm{position:absolute;left:12px;right:12px;bottom:11px;z-index:3;display:flex;flex-direction:column;gap:2px;}
.ccard .cm b{font-family:var(--head);font-size:16px;line-height:1.15;font-weight:650;text-shadow:0 1px 8px rgba(0,0,0,.6);}
.ccard .cm small{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#F3DDBF;opacity:.9;}
.ccard .dk{position:absolute;inset:0;z-index:5;background:#0B0705;opacity:var(--dk,0);pointer-events:none;}
.ccard .ctag{position:absolute;top:10px;inset-inline-start:10px;z-index:3;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(10,6,3,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);}
.ccard:focus-visible{outline:3px solid #F6C04E;outline-offset:3px;}
@media (max-width:560px){.ccard{--cw:118px;border-radius:18px;}.ccard .cm b{font-size:13.5px;}.ccard .cm small{font-size:9.5px;}}

/* ---------- languages ---------- */
.langs{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;justify-content:center;}

/* ---------- faq ---------- */
.faq{background:transparent;color:var(--cream);--ink:#F5EEE5;--sub:#C9B8A6;--line:rgba(255,215,170,.14);--glass:30,22,16;--ga:.55;--surf:#1C140F;--accent:#F6C04E;--bg:#0E0906;--bg2:#140D09;--herb:#7BE0A6;--shadow:0 1px 2px rgba(0,0,0,.45),0 22px 50px -22px rgba(0,0,0,.85);}
.faqs{max-width:820px;margin:36px auto 0;display:flex;flex-direction:column;gap:10px;}

.faqs summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 20px;font-family:var(--head);font-weight:600;font-size:clamp(17px,1.8vw,19.5px);letter-spacing:-.01em;}

  background:linear-gradient(currentColor,currentColor) center/12px 1.8px no-repeat,linear-gradient(currentColor,currentColor) center/1.8px 12px no-repeat;transition:transform .35s var(--ease);}

.end{overflow:hidden;background:radial-gradient(800px 500px at 50% 0%,rgba(232,154,18,.26),transparent 62%),radial-gradient(600px 400px at 10% 100%,rgba(200,54,74,.2),transparent 60%);}

.float.c{left:7%;bottom:12%;transform:rotate(8deg);animation-delay:-4s;}
.float.d{right:7%;bottom:10%;transform:rotate(-9deg);animation-delay:-5.5s;}

  function textShape(txt,font,w){var c=document.createElement('canvas'),W=900,H=360;c.width=W;c.height=H;var x=c.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
